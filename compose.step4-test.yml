services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: step4_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: step4-local-test-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d step4_test]
      interval: 2s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:step4-local-test-only@postgres/step4_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:step4-local-test-only@postgres/step4_test
      OWNER_API_KEY: step4-local-owner-test
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: [127.0.0.1:18005:80]
    depends_on: [backend]
