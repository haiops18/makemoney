services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: step6_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: step6-local-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d step6_test]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:step6-local-only@postgres/step6_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:step6-local-only@postgres/step6_test
      OWNER_API_KEY: step6-local-test
      AI_CREDENTIALS_KEY: ${STEP6_TEST_KEY:?Provide a disposable test encryption key}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: [127.0.0.1:18007:80]
    depends_on:
      backend: {condition: service_healthy}
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:step6-local-only@postgres/step6_test
    command: [python, -m, app.orchestration.worker]
    depends_on:
      postgres: {condition: service_healthy}
      backend: {condition: service_healthy}
