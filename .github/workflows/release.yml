name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci && npm run lint && npm run typecheck && npm test && npx playwright install --with-deps chromium && npm run test:e2e && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: pip install -r requirements.txt && python -m pytest
        working-directory: backend
      - run: pip install pip-audit && pip-audit -r requirements.txt
        working-directory: backend
      - run: chmod +x scripts/docker-smoke.sh && scripts/docker-smoke.sh
      - run: docker compose -p step4-release -f compose.step4-test.yml up --build -d --wait
      - run: docker compose -p step4-release -f compose.step4-test.yml exec -T backend timeout 120 python -m pytest -vv -o faulthandler_timeout=30
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18005
      - if: always()
        run: docker compose -p step4-release -f compose.step4-test.yml down
      - run: docker compose -p step5-release -f compose.step5-test.yml up --build -d --wait
      - run: docker compose -p step5-release -f compose.step5-test.yml stop worker
      - run: docker compose -p step5-release -f compose.step5-test.yml exec -T backend timeout 120 python -m pytest -q -o faulthandler_timeout=30
      - run: docker compose -p step5-release -f compose.step5-test.yml start worker
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18006
          E2E_STEP5: '1'
          E2E_COMPOSE_PROJECT: step5-release
      - if: always()
        run: docker compose -p step5-release -f compose.step5-test.yml down
      - run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
