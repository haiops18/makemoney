name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
  docker-runtime:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/docker-smoke.sh && scripts/docker-smoke.sh
  opportunity-runtime:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: docker compose -p step4-ci -f compose.step4-test.yml up --build -d --wait
      - run: docker compose -p step4-ci -f compose.step4-test.yml exec -T backend timeout 120 python -m pytest -vv -o faulthandler_timeout=30
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18005
      - if: always()
        run: docker compose -p step4-ci -f compose.step4-test.yml down
  workflow-runtime:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: docker compose -p step5-ci -f compose.step5-test.yml up --build -d --wait
      - run: docker compose -p step5-ci -f compose.step5-test.yml stop worker
      - run: docker compose -p step5-ci -f compose.step5-test.yml exec -T backend timeout 120 python -m pytest -q -o faulthandler_timeout=30
      - run: docker compose -p step5-ci -f compose.step5-test.yml start worker
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18006
          E2E_STEP5: '1'
          E2E_COMPOSE_PROJECT: step5-ci
      - if: always()
        run: docker compose -p step5-ci -f compose.step5-test.yml down
  ai-configuration-runtime:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Generate disposable test encryption key
        run: |
          step6_test_key=$(openssl rand -base64 32 | tr '+/' '-_')
          echo "::add-mask::$step6_test_key"
          echo "STEP6_TEST_KEY=$step6_test_key" >> "$GITHUB_ENV"
      - run: docker compose -p step6-ci -f compose.step6-test.yml up --build -d --wait
      - run: docker compose -p step6-ci -f compose.step6-test.yml stop worker
      - run: docker compose -p step6-ci -f compose.step6-test.yml exec -T backend timeout 120 python -m pytest -q -o faulthandler_timeout=30
      - run: docker compose -p step6-ci -f compose.step6-test.yml start worker
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test e2e/ai-providers.spec.ts e2e/integrations.spec.ts
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18007
          E2E_STEP6: '1'
      - if: always()
        run: docker compose -p step6-ci -f compose.step6-test.yml down

