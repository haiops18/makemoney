name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=critical
  docker-runtime:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/docker-smoke.sh && scripts/docker-smoke.sh
  opportunity-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: docker compose -p step4-ci -f compose.step4-test.yml up --build -d --wait
      - run: docker compose -p step4-ci -f compose.step4-test.yml exec -T backend python -m pytest -q
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18005
      - if: always()
        run: docker compose -p step4-ci -f compose.step4-test.yml down

